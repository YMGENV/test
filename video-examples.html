<style>
  :root{
    --bg: #060c1c;
    --panel: #0d1730;
    --line: #1d2c52;
    --ink: #7eb6ff;
    --muted: #6f86b3;
    --accent: #5ee0c0;
    --gold: #e8c468;
    --dur-fast: 150ms;
    --dur-base: 250ms;
    --dur-slow: 400ms;
    --ease-out: cubic-bezier(0.2, 0.8, 0.4, 1);
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1000px 500px at 15% -5%, rgba(232,196,104,0.10), transparent 60%),
      radial-gradient(1200px 700px at 85% 0%, rgba(74,131,255,0.18), transparent 55%),
      radial-gradient(1400px 900px at 50% 110%, rgba(33,76,168,0.25), transparent 60%),
      linear-gradient(180deg, #060c1c 0%, #0a1530 45%, #081026 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pageExit {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-8px); }
  }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  main{
    animation: pageEnter var(--dur-base) var(--ease-out) forwards;
    will-change: opacity, transform;
  }

  main.exit{
    animation: pageExit var(--dur-fast) var(--ease-smooth) forwards;
  }

  header{
    width:100%;
    max-width:1000px;
    padding: 36px 24px 12px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:14px;
  }

  .header-left{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .site-url{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.2px;
    border: 1px solid var(--line);
    padding: 6px 12px 6px 8px;
    border-radius: 8px;
    transition: border-color var(--dur-fast) var(--ease-smooth), color var(--dur-fast) var(--ease-smooth), transform var(--dur-fast) var(--ease-smooth);
  }

  .site-url:hover{
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .site-url img{
    height: 26px;
    width: auto;
    display:block;
    background: #ffffff;
    border-radius: 5px;
    padding: 3px 5px;
  }

  .logo-slot{
    width:48px;
    height:48px;
    border-radius:10px;
    background: transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color: var(--muted);
    flex-shrink:0;
    overflow:hidden;
  }

  .logo-slot img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .site-nav{
    width:100%;
    max-width:1000px;
    padding: 0 24px 24px;
    margin-top: 24px;
  }

  .nav-inner{
    display:flex;
    gap: 0;
    background: rgba(13,23,48,0.5);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0;
    overflow:hidden;
  }

  .site-nav a{
    flex:1;
    color: var(--muted);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    text-align:center;
    padding: 12px 16px;
    border-right: 1px solid var(--line);
    transition: color var(--dur-fast) var(--ease-smooth), background var(--dur-fast) var(--ease-smooth), transform var(--dur-fast) var(--ease-smooth);
    position: relative;
    will-change: transform;
  }

  .site-nav a:last-child{
    border-right:none;
  }

  .site-nav a:hover{
    background: rgba(94,224,192,0.08);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .site-nav a.active{
    background: rgba(94,224,192,0.12);
    color: var(--accent);
    font-weight: 600;
  }

  main{
    width:100%;
    max-width:1000px;
    padding: 0 24px 60px;
  }

  .title-block{
    margin-bottom: 48px;
  }

  .title-block h1{
    font-size: 48px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    margin-bottom: 12px;
    line-height: 1.15;
  }

  .subtitle{
    font-size: 16px;
    color: var(--muted);
    margin:0;
    line-height: 1.6;
  }

  .video-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 48px;
  }

  .video-card{
    background: rgba(13,23,48,0.6);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow:hidden;
    transition: border-color var(--dur-fast) var(--ease-smooth), background var(--dur-fast) var(--ease-smooth), transform var(--dur-fast) var(--ease-smooth), box-shadow var(--dur-fast) var(--ease-smooth);
    display:flex;
    flex-direction:column;
    animation: cardFadeIn var(--dur-base) var(--ease-out) backwards;
    will-change: opacity, transform;
  }

  .video-card:nth-child(1) { animation-delay: 0ms; }
  .video-card:nth-child(2) { animation-delay: 80ms; }
  .video-card:nth-child(3) { animation-delay: 160ms; }
  .video-card:nth-child(4) { animation-delay: 240ms; }
  .video-card:nth-child(5) { animation-delay: 320ms; }

  .video-card:hover{
    border-color: var(--accent);
    background: rgba(13,23,48,0.8);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(94,224,192,0.1);
  }

  .video-card.short{
    grid-column: span 1;
  }

  .video-frame{
    width:100%;
    position:relative;
    background:#000;
    overflow:hidden;
  }

  .video-card:not(.short) .video-frame{
    padding-bottom: 56.25%;
  }

  .video-card.short .video-frame{
    padding-bottom: 177.78%;
  }

  .video-frame iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
  }

  .video-card h3{
    margin: 20px 20px 8px;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  .video-card p{
    margin: 0 20px 20px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    flex-grow:1;
  }

  .actions{
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .btn{
    display: inline-flex;
    align-items:center;
    justify-content:center;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: border-color var(--dur-fast) var(--ease-smooth), color var(--dur-fast) var(--ease-smooth), background var(--dur-fast) var(--ease-smooth), transform var(--dur-fast) var(--ease-smooth), box-shadow var(--dur-fast) var(--ease-smooth);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    position: relative;
    will-change: transform;
  }

  .btn:hover{
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(94,224,192,0.08);
    transform: translateY(-1px);
  }

  .btn:active{
    transform: scale(0.98);
  }

  .btn-primary{
    background: linear-gradient(135deg, rgba(232,196,104,0.15), rgba(94,224,192,0.1));
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn-primary:hover{
    border-color: var(--gold);
    color: var(--gold);
    background: linear-gradient(135deg, rgba(232,196,104,0.25), rgba(94,224,192,0.15));
    box-shadow: 0 0 20px rgba(232,196,104,0.2);
  }

  footer{
    width:100%;
    max-width:1000px;
    padding: 24px;
    text-align:center;
    color: var(--muted);
    font-size: 12px;
    margin-top: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 768px) and (hover: none) {
    .video-card:hover {
      transform: none;
    }

    .btn:hover {
      transform: none;
    }

    :root {
      --dur-base: 200ms;
    }
  }

  @media (max-width: 768px) {
    .video-grid{
      grid-template-columns: 1fr;
    }

    .title-block h1{
      font-size: 36px;
    }

    .nav-inner{
      flex-wrap: wrap;
    }

    .site-nav a{
      flex: 0 1 auto;
      padding: 10px 12px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-slot"></div>
    </div>
    <a href="https://bysolutions.in" class="site-url" target="_blank">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1L1 5v5c0 4.418 7 5 7 5s7-.582 7-5V5l-7-4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      bysolutions.in
    </a>
  </header>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="plans.html">Plans</a>
      <a href="video-examples.html" class="active">Video Examples</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </nav>

  <main>
    <div class="title-block">
      <h1>Video Examples</h1>
      <p class="subtitle">A look at real AI-generated videos we've produced.</p>
    </div>

    <div class="video-grid" id="videoGrid">
      <!-- Videos loaded dynamically from videos.json -->
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="plans.html">See Plans &amp; Pricing</a>
      <a class="btn" href="contact.html">Ask a Question</a>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> BY Solutions. All rights reserved. | <a href="https://bysolutions.in" style="color: var(--accent); text-decoration: none;">Visit bysolutions.in</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function extractVideoId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?\s]+)/,
        /v=([^&?\s]+)/
      ];
      
      for (let pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    async function loadVideos() {
      try {
        const response = await fetch('videos.json');
        const videos = await response.json();
        const grid = document.getElementById('videoGrid');
        
        videos.forEach((video, index) => {
          const videoId = extractVideoId(video.url);
          if (!videoId) return;
          
          const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1`;
          const isFirst = index === 0;
          const cardClass = isFirst ? '' : 'short';
          
          const card = document.createElement('div');
          card.className = `video-card ${cardClass}`;
          card.innerHTML = `
            <div class="video-frame">
              <iframe src="${embedUrl}"
                      title="${video.title}"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                      allowfullscreen loading="lazy"></iframe>
            </div>
            <h3>${video.title}</h3>
            <p>${isFirst ? 'A sample of our custom AI video production.' : 'A dynamic video showcasing our creative style.'}</p>
          `;
          
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading videos:', error);
      }
    }

    loadVideos();

    document.querySelectorAll('.site-nav a').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href === window.location.pathname || href === window.location.href) {
          e.preventDefault();
        } else {
          const main = document.querySelector('main');
          main.classList.add('exit');
          
          setTimeout(() => {
            window.location.href = href;
          }, 150);
        }
      });
    });
  </script>

</body>
